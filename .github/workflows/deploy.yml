name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Bygg med Astro
        uses: withastro/action@v4
        with:
          node-version: 22
          package-manager: npm
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          # Overstyr ved eget domene (f.eks. BASE_PATH=/)
          SITE_URL: https://kkas18.github.io
          BASE_PATH: /Linjen

  deploy:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
