name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      # OG-bildene genereres med Playwright som en del av `npm run build`
      - name: Installer Chromium for OG-bilder
        run: npx playwright install --with-deps chromium

      - name: Bygg
        run: npm run build
        env:
          # Overstyr ved eget domene (f.eks. BASE_PATH=/)
          SITE_URL: https://kkas18.github.io
          BASE_PATH: /Linjen

      - name: Last opp nettstedet
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
